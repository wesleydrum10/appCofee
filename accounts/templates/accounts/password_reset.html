{% extends "layouts/auth.html" %}
{% block auth_content %}
<p class="text-xs font-bold uppercase tracking-[0.2em] text-caramel">Acesso</p>
<h1 class="brand-heading text-3xl text-espresso">Recuperar senha</h1>
<form method="post" class="mt-4 space-y-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="brand-button w-full text-sm" data-action-state data-pending-label="Enviando instruções..." data-action-icon="mail">Enviar instruções</button>
</form>
{% endblock %}
