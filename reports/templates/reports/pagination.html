{% if page.has_other_pages %}<nav class="management-pagination" aria-label="Páginas">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}" aria-label="Página anterior" title="Página anterior"><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}" aria-label="Próxima página" title="Próxima página"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></a>{% endif %}</nav>{% endif %}
