name: appcoffee

services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8001"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      # This Compose setup uses Django's development server for static files.
      DEBUG: "True"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Inside Docker the database hostname is the Compose service name.
      DATABASE_URL: postgres://${POSTGRES_USER:-appcoffee}:${POSTGRES_PASSWORD:-appcoffee}@db:5432/${POSTGRES_DB:-appcoffee}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8001/', headers={'Host': 'localhost'}), timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appcoffee}
      POSTGRES_USER: ${POSTGRES_USER:-appcoffee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appcoffee}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  media_data:
