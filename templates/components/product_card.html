<article class="group flex flex-col overflow-hidden rounded-2xl border border-latte bg-white shadow-warm transition hover:-translate-y-0.5 hover:shadow-float">
  <a href="{{ product.get_absolute_url }}" class="block">
    <div class="relative aspect-square overflow-hidden bg-butter">
      {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="h-full w-full object-cover transition duration-300 group-hover:scale-105" loading="lazy">
      {% else %}
        <div class="flex h-full items-center justify-center px-3 text-center text-xs font-semibold text-dust">Imagem do produto</div>
      {% endif %}
      {% if product.is_new %}<span class="absolute left-2 top-2 rounded-full bg-[#ffdcc2]/95 px-2.5 py-1 text-[10px] font-bold text-[#6d3a00] backdrop-blur">Novidade</span>{% endif %}
    </div>
    <div class="space-y-1.5 p-3">
      <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-caramel">{{ product.category.name }}</p>
      <h3 class="line-clamp-2 min-h-10 text-sm font-bold leading-snug text-espresso">{{ product.name }}</h3>
      <p class="brand-price">R$ {{ product.price }}</p>
      {% if product.is_available %}
        <span class="inline-flex rounded-full bg-[#eaf2ed] px-2.5 py-1 text-[11px] font-bold text-sage">Disponível</span>
      {% else %}
        <span class="inline-flex rounded-full bg-[#ffdad6] px-2.5 py-1 text-[11px] font-bold text-terracotta">Indisponível</span>
      {% endif %}
    </div>
  </a>
  <form method="post" action="{% url 'cart:add' product.id %}" class="px-3 pb-3">
    {% csrf_token %}
    <button class="brand-button w-full gap-1 text-sm" data-action-state data-idle-label="Pedir" data-pending-label="Adicionando..." data-success-label="Adicionado">
      <span class="material-symbols-outlined text-[18px]">add</span>
      Pedir
    </button>
  </form>
</article>
