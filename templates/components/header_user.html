{% if request.user.is_authenticated %}
<a class="header-user" href="{% url 'accounts:profile' %}" title="Minha conta: {{ request.user }}" aria-label="Minha conta: {{ request.user }}">
  <span class="header-user-avatar material-symbols-outlined" aria-hidden="true">person</span>
  <span class="header-user-details">
    <span class="header-user-name">{{ request.user.get_full_name|default:request.user.email }}</span>
    <span class="header-user-role">{{ request.user.get_role_display }}</span>
  </span>
</a>
{% endif %}
